name: Build Distributables

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    name: Windows (NSIS installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Cache electron binaries
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\electron\Cache
          key: electron-win-${{ hashFiles('package-lock.json') }}
      - name: Cache electron-builder tools
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\electron-builder\Cache
          key: electron-builder-win-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Windows
        shell: bash
        run: npm run build:win 2>&1 | tee build-log.txt ; exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log-windows
          path: build-log.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Dispensary-Tracker-Windows
          path: dist/*.exe

  build-mac:
    name: macOS (Universal DMG)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Cache electron binaries
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/electron
          key: electron-mac-${{ hashFiles('package-lock.json') }}
      - name: Cache electron-builder tools
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/electron-builder
          key: electron-builder-mac-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build macOS
        shell: bash
        run: npm run build:mac 2>&1 | tee build-log.txt ; exit ${PIPESTATUS[0]}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log-macos
          path: build-log.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Dispensary-Tracker-macOS
          path: dist/*.dmg

  build-linux:
    name: Linux (AppImage + deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Cache electron binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-linux-${{ hashFiles('package-lock.json') }}
      - name: Cache electron-builder tools
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron-builder
          key: electron-builder-linux-${{ hashFiles('package-lock.json') }}
      - name: Install Linux build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y fakeroot
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Linux
        shell: bash
        run: npm run build:linux 2>&1 | tee build-log.txt ; exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log-linux
          path: build-log.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Dispensary-Tracker-Linux
          path: |
            dist/*.AppImage
            dist/*.deb

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-mac, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Create or update release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "release-files/**/*"
          tag: "latest"
          name: "Latest Build"
          body: |
            Automatically built from the latest commit on `main`.

            | Platform | File |
            |----------|------|
            | Windows  | `Dispensary-Tracker-Setup-*.exe` |
            | macOS    | `Dispensary-Tracker-*.dmg` |
            | Linux    | `Dispensary-Tracker-*.AppImage` / `*.deb` |
          allowUpdates: true
          removeArtifacts: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
